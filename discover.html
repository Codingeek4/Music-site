<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Site</title>
    <link rel="stylesheet" href="discover.css">
</head>
<body>
<container id="container1">
        <box id="box1">
            <button id="closebutton">
                <image id="close" src="menu.png" alt="Close Icon">
                <p id="menutext">Menu</p>
            </button>
        </box>
        <box id="box2">
            <button id="Button2" onclick="location.href='index.html'"></button>
            <image id="homeicon" src="home.png" alt="Home Icon">
            <a id="home">Home</a>
        </box>
        <box id="box3">
            <button id="Button3" onclick="location.href='library.html'"></button>
            <image id="libraryicon" src="library.png" alt="Library Icon">
            <a id="library">Library</a>
        </box>
        <box id="box4">
            <button id="Button4" onclick="location.href='discover.html'"></button>
            <image id="discovericon" src="discover.png" alt="Discover Icon">
            <a id="discover">Discover</a>
        </box>
        <box id="box5">
            <button id="Button5" onclick="alert('Thank you for your support!')"></button>
            <image id="donateicon" src="donate.png" alt="Donate Icon">
            <a id="donate">Donate</a>
        </box>
        <p id="version">Version 1.0</p>
    </container>
    <script src="discover.js"></script>
</body>
</html>
